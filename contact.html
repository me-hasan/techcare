<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>যোগাযোগ | Contact – টেক কেয়ার Tech Care</title>
<meta name="description" content="Contact Tech Care — mobile servicing training center and repair service in Mirpur, Dhaka. Call, email or visit our lab.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-white text-ink antialiased">

<div id="site-header"></div>

<!-- ============ PAGE HEAD ============ -->
<section class="relative bg-ink text-white overflow-hidden">
  <div class="absolute inset-0 bg-grid opacity-70"></div>
  <div class="absolute -top-28 right-0 w-96 h-96 rounded-full bg-brand-600/25 blur-3xl"></div>
  <div class="relative container mx-auto max-w-8xl px-4 lg:px-8 py-14 lg:py-16">
    <nav class="flex items-center gap-2 text-xs text-white/50">
      <a href="index.html" class="hover:text-brand-400" data-bn="হোম" data-en="Home"></a>
      <span>/</span>
      <span class="text-white/80" data-bn="যোগাযোগ" data-en="Contact"></span>
    </nav>
    <h1 class="mt-5 text-3xl lg:text-5xl font-extrabold" data-bn="যোগাযোগ করুন" data-en="Get in touch"></h1>
    <p class="mt-4 text-white/65 max-w-2xl leading-relaxed"
       data-bn="কোর্স, ফি, সার্ভিস চার্জ বা যেকোনো প্রশ্নে আমাদের সাথে যোগাযোগ করুন। কর্মদিবসে সকাল ৯টা থেকে রাত ৮টা পর্যন্ত আমরা পাশে আছি।"
       data-en="Reach out for courses, fees, service charges or any question. We are available from 9 AM to 8 PM on working days."></p>
  </div>
</section>

<!-- ============ INFO CARDS ============ -->
<section class="py-14 lg:py-16">
  <div class="container mx-auto max-w-8xl px-4 lg:px-8 grid gap-6 md:grid-cols-2 lg:grid-cols-4">
    <a href="tel:+8801700000000" class="reveal tc-card rounded-2xl border border-black/10 bg-white p-7 block">
      <span class="grid place-items-center w-12 h-12 rounded-xl bg-brand-50 text-brand-600">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.4 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg>
      </span>
      <h3 class="mt-4 font-bold text-ink" data-bn="ফোন ও হোয়াটসঅ্যাপ" data-en="Phone & WhatsApp"></h3>
      <p class="mt-2 text-sm text-ink-400">+880 1700-000000<br>+880 1800-000000</p>
    </a>

    <a href="mailto:info@techcare.com.bd" class="reveal tc-card rounded-2xl border border-black/10 bg-white p-7 block">
      <span class="grid place-items-center w-12 h-12 rounded-xl bg-brand-50 text-brand-600">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
      </span>
      <h3 class="mt-4 font-bold text-ink" data-bn="ইমেইল" data-en="Email"></h3>
      <p class="mt-2 text-sm text-ink-400">info@techcare.com.bd<br>admission@techcare.com.bd</p>
    </a>

    <div class="reveal tc-card rounded-2xl border border-black/10 bg-white p-7">
      <span class="grid place-items-center w-12 h-12 rounded-xl bg-brand-50 text-brand-600">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 22s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      </span>
      <h3 class="mt-4 font-bold text-ink" data-bn="ঠিকানা" data-en="Address"></h3>
      <p class="mt-2 text-sm text-ink-400" data-bn="১২৩ মেইন রোড, মিরপুর-১০<br>ঢাকা-১২১৬, বাংলাদেশ" data-en="123 Main Road, Mirpur-10<br>Dhaka-1216, Bangladesh"></p>
    </div>

    <div class="reveal tc-card rounded-2xl border border-black/10 bg-white p-7">
      <span class="grid place-items-center w-12 h-12 rounded-xl bg-brand-50 text-brand-600">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </span>
      <h3 class="mt-4 font-bold text-ink" data-bn="খোলার সময়" data-en="Opening hours"></h3>
      <p class="mt-2 text-sm text-ink-400" data-bn="শনি - বৃহস্পতি<br>সকাল ৯টা - রাত ৮টা" data-en="Saturday - Thursday<br>9:00 AM - 8:00 PM"></p>
    </div>
  </div>
</section>

<!-- ============ FORM + MAP ============ -->
<section class="pb-16 lg:pb-24">
  <div class="container mx-auto max-w-8xl px-4 lg:px-8 grid gap-10 lg:grid-cols-2 items-start">

    <form class="tc-form reveal rounded-2xl border border-black/10 bg-white p-6 lg:p-9 shadow-card grid gap-5 sm:grid-cols-2"
          data-success-bn="আপনার বার্তা পেয়েছি। আমরা ২৪ ঘণ্টার মধ্যে উত্তর দেব।"
          data-success-en="We received your message and will reply within 24 hours.">
      <div class="sm:col-span-2">
        <h2 class="text-xl font-extrabold text-ink" data-bn="বার্তা পাঠান" data-en="Send us a message"></h2>
        <p class="mt-1 text-sm text-ink-400" data-bn="ফরমটি পূরণ করলে আমরা দ্রুত যোগাযোগ করতে পারব।" data-en="Fill the form and we will get back to you quickly."></p>
      </div>
      <div>
        <label class="tc-label"><span data-bn="নাম" data-en="Name"></span> <span class="text-brand-600">*</span></label>
        <input required type="text" class="tc-input" data-ph-bn="আপনার নাম" data-ph-en="Your name">
      </div>
      <div>
        <label class="tc-label"><span data-bn="মোবাইল নম্বর" data-en="Mobile number"></span> <span class="text-brand-600">*</span></label>
        <input required type="tel" class="tc-input" data-ph-bn="০১৭xxxxxxxx" data-ph-en="017xxxxxxxx">
      </div>
      <div class="sm:col-span-2">
        <label class="tc-label" data-bn="ইমেইল (ঐচ্ছিক)" data-en="Email (optional)"></label>
        <input type="email" class="tc-input" data-ph-bn="you@example.com" data-ph-en="you@example.com">
      </div>
      <div class="sm:col-span-2">
        <label class="tc-label"><span data-bn="বিষয়" data-en="Subject"></span> <span class="text-brand-600">*</span></label>
        <select required class="tc-input">
          <option value="" data-bn="বিষয় নির্বাচন করুন" data-en="Select a subject"></option>
          <option value="admission" data-bn="ভর্তি সংক্রান্ত" data-en="Admission"></option>
          <option value="course" data-bn="কোর্স ও ফি সংক্রান্ত" data-en="Course and fees"></option>
          <option value="service" data-bn="রিপেয়ার সার্ভিস" data-en="Repair service"></option>
          <option value="business" data-bn="ব্যবসায়িক প্রস্তাব" data-en="Business proposal"></option>
          <option value="other" data-bn="অন্য কিছু" data-en="Something else"></option>
        </select>
      </div>
      <div class="sm:col-span-2">
        <label class="tc-label"><span data-bn="বার্তা" data-en="Message"></span> <span class="text-brand-600">*</span></label>
        <textarea required rows="5" class="tc-input" data-ph-bn="আপনার প্রশ্ন বা প্রয়োজন সংক্ষেপে লিখুন..." data-ph-en="Briefly describe your question or requirement..."></textarea>
      </div>
      <div class="sm:col-span-2">
        <button type="submit" class="w-full rounded-full bg-brand-600 py-3.5 font-semibold text-white hover:bg-brand-700 transition"
                data-bn="বার্তা পাঠান" data-en="Send Message"></button>
      </div>
    </form>

    <div class="space-y-6">
      <div class="reveal rounded-2xl overflow-hidden border border-black/10 bg-smoke">
        <iframe title="Tech Care location" class="w-full h-80 lg:h-96 border-0"
                src="https://www.openstreetmap.org/export/embed.html?bbox=90.355%2C23.790%2C90.415%2C23.832&layer=mapnik"></iframe>
      </div>

      <div class="reveal rounded-2xl bg-ink text-white p-7">
        <h3 class="font-bold" data-bn="ল্যাব ভিজিটের আমন্ত্রণ" data-en="An open invitation to visit"></h3>
        <p class="mt-2 text-sm text-white/65 leading-relaxed"
           data-bn="ভর্তি হওয়ার আগেই চাইলে আমাদের ল্যাব দেখে যেতে পারেন। কর্মদিবসে যেকোনো সময় আসুন, আমাদের টেকনিশিয়ানরা সব দেখাবেন। কোনো অ্যাপয়েন্টমেন্টের প্রয়োজন নেই।"
           data-en="You can visit our lab before enrolling. Drop in any working day — our technicians will show you around. No appointment needed."></p>
        <div class="mt-5 grid gap-3 sm:grid-cols-2 text-sm">
          <a href="courses.html" class="rounded-full bg-brand-600 px-5 py-3 text-center font-semibold hover:bg-brand-700 transition" data-bn="কোর্স দেখুন" data-en="Browse Courses"></a>
          <a href="admission.html" class="rounded-full border border-white/25 px-5 py-3 text-center font-semibold hover:border-brand-500 transition" data-bn="ভর্তি হোন" data-en="Get Admission"></a>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
