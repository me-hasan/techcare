  <div class="absolute -bottom-24 -left-20 w-96 h-96 rounded-full bg-brand-700/25 blur-3xl"></div>
  <div class="relative container mx-auto max-w-8xl px-4 lg:px-8 py-16 lg:py-20 grid gap-12 lg:grid-cols-2 items-center">
    <div class="reveal">
      <h2 class="text-3xl lg:text-4xl font-extrabold leading-tight"
          data-bn="আজই আপনার সিট নিশ্চিত করুন" data-en="Reserve your seat today"></h2>
      <p class="mt-4 text-white/65 leading-relaxed max-w-lg"
         data-bn="ফরম পূরণ করুন, আমাদের কাউন্সিলর ২৪ ঘণ্টার মধ্যে কল করে ব্যাচ, সময় ও ফি সম্পর্কে বিস্তারিত জানাবেন।"
         data-en="Fill in the form and our counselor will call you within 24 hours with batch, timing and fee details."></p>
      <div class="mt-7 flex flex-wrap items-center gap-x-8 gap-y-3 text-sm text-white/60">
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 13 4 4L19 7"/></svg>
          <span data-bn="ফ্রি কাউন্সিলিং" data-en="Free counseling"></span></span>
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 13 4 4L19 7"/></svg>
          <span data-bn="কিস্তিতে ফি" data-en="Instalment facility"></span></span>
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 13 4 4L19 7"/></svg>
          <span data-bn="ফ্রি রিভিশন ক্লাস" data-en="Free revision classes"></span></span>
      </div>
    </div>

    <form class="tc-form reveal rounded-2xl bg-white p-6 lg:p-8 shadow-card grid gap-4 sm:grid-cols-2"
          data-success-bn="আপনার আবেদন পেয়েছি। আমাদের কাউন্সিলর শীঘ্রই আপনার সাথে যোগাযোগ করবেন।"
          data-success-en="We received your application. Our counselor will contact you shortly.">
      <div class="sm:col-span-2">
        <label class="tc-label" data-bn="পুরো নাম" data-en="Full name"></label>
        <input required type="text" class="tc-input" data-ph-bn="যেমন: মো. রাকিব হাসান" data-ph-en="e.g. Md. Rakib Hasan">
      </div>
      <div>
        <label class="tc-label" data-bn="মোবাইল নম্বর" data-en="Mobile number"></label>
        <input required type="tel" class="tc-input" data-ph-bn="০১৭xxxxxxxx" data-ph-en="017xxxxxxxx">
      </div>
      <div>
        <label class="tc-label" data-bn="আগ্রহী কোর্স" data-en="Interested course"></label>
        <select required data-course-select class="tc-input"></select>
      </div>
      <div class="sm:col-span-2">
        <button type="submit" class="w-full rounded-full bg-brand-600 py-3.5 font-semibold text-white hover:bg-brand-700 transition"
                data-bn="আবেদন পাঠান" data-en="Send Application"></button>
        <p class="mt-3 text-center text-xs text-ink-400"
           data-bn="আপনার তথ্য শুধুমাত্র ভর্তি প্রক্রিয়ার জন্য ব্যবহৃত হবে।"
           data-en="Your information is used only for the admission process."></p>
      </div>
    </form>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
